name: Unzip, Flatten, and Commit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Gives the action permission to write changes back to your repository
permissions:
  contents: write

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and Clean ZIP
        run: |
          # 1. Unzip the file
          unzip DoNex-Base.zip
          
          # 2. Move everything from inside DoNex to the root directory
          shopt -s dotglob
          mv DoNex/* ./
          shopt -u dotglob
          
          # 3. Clean up the empty folder and the original ZIP file
          rm -rf DoNex
          rm DoNex-Base.zip

      - name: Commit and Push changes
        run: |
          # Configure Git using the standard GitHub Actions bot profile
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Stage all changes (adds new files, tracks deletions of the ZIP)
          git add -A
          
          # Commit only if there are actual changes to prevent workflow errors
          git diff-index --quiet HEAD || git commit -m "Automated: Unzipped and flattened DoNex-Base.zip"
          
          # Push changes back to the main branch
          git push origin HEAD:${{ github.ref }}
          
